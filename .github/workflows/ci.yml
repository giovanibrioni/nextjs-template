name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec drizzle-kit migrate
      - run: pnpm exec biome check .
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

  deliver:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: homelab
    steps:
      - uses: actions/checkout@v5
      - name: Build and publish
        run: |
          set -eu
          short=$(git rev-parse --short=7 HEAD)
          app=nextjs-template
          image="registry.registry.svc.cluster.local:5000/${app}:${short}"
          docker build -t "$image" .
          docker push "$image"
          token=$(cat /etc/homelab/infra-token)
          rm -rf /tmp/homelab-infra
          git clone "https://x-access-token:${token}@github.com/giovanibrioni/homelab-infra.git" /tmp/homelab-infra
          cd /tmp/homelab-infra
          git config user.name homelab-ci
          git config user.email homelab-ci@users.noreply.github.com
          if [ ! -f "apps/${app}/kustomization.yaml" ]; then
            mkdir -p "apps/${app}"
            cp -a "${GITHUB_WORKSPACE}/deploy/." "apps/${app}/"
          fi
          sed -i "s/newTag: .*/newTag: \"${short}\"/" "apps/${app}/kustomization.yaml"
          git add "apps/${app}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy(${app}): ${short}"
          ok=0
          for _ in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1

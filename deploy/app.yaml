apiVersion: v1
kind: Service
metadata:
  name: nextjs-template
spec:
  selector:
    app: nextjs-template
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextjs-template
  template:
    metadata:
      labels:
        app: nextjs-template
    spec:
      initContainers:
        - name: migrate
          image: app
          command: ["node", "/opt/migrate/migrate.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nextjs-template-db
                  key: DATABASE_URL
      containers:
        - name: nextjs-template
          image: app
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: nextjs-template-env
                optional: true
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: ENVIRONMENT
              value: homelab
            - name: LOG_JSON
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: nextjs-template
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=homelab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://signoz-k8s-infra-otel-agent.o11y.svc.cluster.local:4318
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nextjs-template-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
